name: chintunes_core
description: >-
  Pure-Dart catalog, stream-extraction and playback-queue layer for chinTunes.
  Ported from the chinTunes-cli Python providers (JioSaavn, YouTube, Spotify, LRCLIB).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  dart_des: ^1.0.1
  dio: ^5.7.0
  googleapis: ^13.2.0
  http: ^1.2.2
  youtube_explode_dart: ^2.3.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
