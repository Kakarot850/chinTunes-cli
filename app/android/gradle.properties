# Low-RAM safe for the 8 GB host. CI raises the heap to 4 GB (see build-apk.yml, B-031).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.caching=true
android.useAndroidX=true
# Every dependency is AndroidX already; Jetifier only re-writes jars (incl. the
# large Flutter engine jar) and ran the Gradle daemon out of heap (B-031).
android.enableJetifier=false
