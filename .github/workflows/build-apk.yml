name: build-apk

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "app/**"
      - "packages/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "packages/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core package (dart analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/chintunes_core
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test (offline, fixture-backed)
        run: dart test --reporter expanded

  app:
    name: App (analyze, test, release APKs)
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional: base64 of a stable debug keystore (alias androiddebugkey,
      # passwords "android"). Without it every runner generates a new key, the
      # SHA-1 changes per build and Google Sign-In fails. See HANDOVER.md §7.
      DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install stable signing key (optional)
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "Using the stable debug keystore from secrets."

      # Gradle build scripts + wrapper + launcher icons are generated for the
      # exact Flutter version on the runner. `flutter create` never overwrites
      # existing files, so the committed AndroidManifest.xml, MainActivity.kt,
      # gradle.properties, res/xml, styles and test/widget_test.dart survive.
      - name: Generate missing Android platform files
        run: flutter create --platforms=android --org com.chintunes --project-name chintunes .

      # Old-major plugins compile against android-34; force >= 36 (B-029).
      - name: Apply compileSdk override to generated Gradle root
        run: |
          test -f android/build.gradle.kts
          grep -q "compile_sdk_override.gradle" android/build.gradle.kts \
            || printf '\n// chinTunes CI (B-029)\napply(from = "compile_sdk_override.gradle")\n' >> android/build.gradle.kts
          tail -4 android/build.gradle.kts

      - name: Verify committed Android files survived
        run: |
          grep -q "AudioServiceActivity" android/app/src/main/kotlin/com/chintunes/chintunes/MainActivity.kt
          grep -q "com.ryanheise.audioservice.AudioService" android/app/src/main/AndroidManifest.xml
          grep -q "network_security_config" android/app/src/main/AndroidManifest.xml
          grep -q "Xmx1536m" android/gradle.properties
          grep -q "SeekBarView" test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      # Copy the SHA-1 below into Google Cloud Console → OAuth client (Android).
      - name: Print signing certificate fingerprints
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E "SHA1|SHA256" || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: chintunes-apks-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
